name: CPU reproduction
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python verify_release.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s research_tools -p test_length_overlap.py -v
      - run: python reproduce.py --output outputs/ci-001
